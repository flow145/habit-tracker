<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit tracker</title>
    <script>
      ;(() => {
        try {
          const { state } = JSON.parse(localStorage.getItem('habit-tracker-theme') ?? '{}')
          const savedPreference = state?.themePreference ?? 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (savedPreference === 'dark' || (savedPreference === 'system' && prefersDark))
            document.documentElement.setAttribute('data-theme', 'dark')
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/entrypoint/main.tsx"></script>
  </body>
</html>
